name: Windows build and checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      CARGO_HOME: ${{ github.workspace }}\.build\cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}\.build\target
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare directories and Rust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup override set 1.96.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
          python --version
          cmake --version
      - name: Prepare pinned dependencies and build
        shell: pwsh
        run: ./scripts/build.ps1 -PrepareAssets
      - name: Test and replay WAVs without recording
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Package and validate
        shell: pwsh
        run: |
          python scripts/package.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          python scripts/validate_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Upload source and verification reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FastASR-windows
          path: |
            dist/*-source.zip
            reports/xasr-self-test.json
            reports/turbo-self-test.json
            reports/pipeline-probe.json
            reports/package-integrity-*.json
          if-no-files-found: error
          retention-days: 14
