[package]
name = "fast-asr"
version = "0.3.2"
edition = "2024"
build = "build.rs"
license = "MIT"
authors = ["BNUZ-HuSir"]
description = "A native Windows desktop voice input app with streaming Chinese/English ASR"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"

[build-dependencies]
cc = "1"
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
